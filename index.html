<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lecteur vidéo</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0f1419;color:#e6e6e6;font:14px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px;gap:12px}
  #player{position:relative;width:min(1000px,100%);background:#000;border-radius:8px;overflow:hidden}
  video{width:100%;display:block;max-height:75vh}
  #drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#8a9199;pointer-events:none}
  #player.has #drop{display:none}
  #player.over{outline:2px dashed #ffb454}
  #bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#1a1f26}
  button,select{background:#262d36;color:inherit;border:0;border-radius:4px;padding:6px 10px;cursor:pointer}
  button:hover,select:hover{background:#323b47}
  input[type=range]{accent-color:#ffb454}
  #seek{flex:1}
  #vol{width:80px}
  #time{font-variant-numeric:tabular-nums;white-space:nowrap}
  #list{width:min(1000px,100%);display:flex;flex-direction:column;gap:4px}
  #list div{padding:6px 10px;background:#1a1f26;border-radius:4px;cursor:pointer}
  #list div.cur{background:#323b47;color:#ffb454}
</style>
</head>
<body>
<div id="player">
  <video id="v"></video>
  <div id="drop">Glissez des vidéos ici<br>ou cliquez sur « Ouvrir »</div>
  <div id="bar">
    <button id="open">Ouvrir</button>
    <button id="prev" title="Précédente">⏮</button>
    <button id="play" title="Lecture/Pause (espace)">▶</button>
    <button id="next" title="Suivante">⏭</button>
    <span id="time">0:00 / 0:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <input id="vol" type="range" min="0" max="1" step="0.05" value="1" title="Volume">
    <select id="speed"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select>
    <button id="fs" title="Plein écran (f)">⛶</button>
  </div>
</div>
<div id="list"></div>
<input id="file" type="file" accept="video/*,audio/*" multiple hidden>
<script>
const $=id=>document.getElementById(id), v=$('v'), pl=$('player');
let files=[], idx=-1;
const fmt=s=>{s=Math.floor(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;
  return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(r).padStart(2,'0')};

function add(fl){
  const vids=[...fl].filter(f=>/^(video|audio)\//.test(f.type)||/\.(mkv|mp4|webm|avi|mov|mp3|ogg)$/i.test(f.name));
  if(!vids.length)return;
  const first=files.length; files.push(...vids); render();
  if(idx<0)load(first);
}
function load(i){
  if(i<0||i>=files.length)return;
  if(v.src)URL.revokeObjectURL(v.src);
  idx=i; v.src=URL.createObjectURL(files[i]); v.playbackRate=+$('speed').value;
  pl.classList.add('has'); v.play().catch(()=>{}); render();
}
function render(){
  $('list').innerHTML='';
  files.forEach((f,i)=>{const d=document.createElement('div');d.textContent=f.name;
    if(i===idx)d.className='cur'; d.onclick=()=>load(i); $('list').append(d)});
}
const toggle=()=>v.paused?v.play():v.pause();
$('open').onclick=()=>$('file').click();
$('file').onchange=e=>{add(e.target.files);e.target.value=''};
$('play').onclick=toggle; v.onclick=toggle;
$('prev').onclick=()=>load(idx-1); $('next').onclick=()=>load(idx+1);
$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():pl.requestFullscreen();
v.onplay=v.onpause=()=>$('play').textContent=v.paused?'▶':'⏸';
v.onended=()=>load(idx+1);
v.ontimeupdate=()=>{$('time').textContent=fmt(v.currentTime)+' / '+fmt(v.duration);
  if(v.duration)$('seek').value=v.currentTime/v.duration*1000};
$('seek').oninput=e=>{if(v.duration)v.currentTime=e.target.value/1000*v.duration};
$('vol').oninput=e=>v.volume=e.target.value;
$('speed').onchange=e=>v.playbackRate=+e.target.value;
v.onerror=()=>{$('drop').textContent='Format non pris en charge par le navigateur';pl.classList.remove('has')};

['dragover','dragenter'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();pl.classList.add('over')}));
['dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();pl.classList.remove('over')}));
document.addEventListener('drop',e=>add(e.dataTransfer.files));

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT')return;
  const k=e.key;
  if(k===' '){e.preventDefault();toggle()}
  else if(k==='ArrowRight')v.currentTime+=5;
  else if(k==='ArrowLeft')v.currentTime-=5;
  else if(k==='ArrowUp'){e.preventDefault();v.volume=Math.min(1,v.volume+.05);$('vol').value=v.volume}
  else if(k==='ArrowDown'){e.preventDefault();v.volume=Math.max(0,v.volume-.05);$('vol').value=v.volume}
  else if(k==='f')$('fs').click();
  else if(k==='m')v.muted=!v.muted;
});
</script>
</body>
</html>
